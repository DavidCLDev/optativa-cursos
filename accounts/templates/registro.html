<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <!-- CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-950 antialiased min-h-screen flex items-center justify-center p-4 text-gray-300">

    <main class="w-full max-w-lg">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl shadow-xl overflow-hidden">

            <!-- Encabezado -->
            <div class="p-6 md:p-8 border-b border-gray-800 text-center space-y-1">
                <span class="text-xs font-semibold text-green-500 uppercase tracking-wider">
                    Gestor de Cursos
                </span>
                <h1 class="text-2xl md:text-3xl font-bold text-white tracking-tight">
                    Crear cuenta
                </h1>
                <p class="text-sm text-gray-500">
                    Completa tus datos para registrarte
                </p>
            </div>

            <!-- Formulario -->
            <form method="post" class="p-6 md:p-8 space-y-5">
                {% csrf_token %}

                <!-- Usuario -->
                <div class="space-y-1.5">
                    <label for="username" class="text-xs font-medium text-gray-400 uppercase
                    tracking-wider">
                        Nombre de usuario
                    </label>
                    <div class="relative">
                        <svg class="w-4 h-4 text-gray-600 absolute left-3.5 top-1/2 -translate-y-1/2"
                        fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                        stroke-linecap="round" stroke-linejoin="round">
                            <path d="M15.75 6a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0ZM4.501 20.118a7.5 7.5 0 0 1 14.998 0A17.933 17.933 0 0 1 12 21.75c-2.676 0-5.216-.584-7.499-1.632Z" />
                        </svg>
                        <input
                            type="text"
                            name="username"
                            id="username"
                            value="{{ datos.username|default:'' }}"
                            required
                            placeholder="Ej. pedrito123"
                            class="w-full bg-gray-950/60 border border-gray-800 rounded-lg pl-10 pr-4
                            py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none
                            focus:border-green-600 focus:ring-2 focus:ring-green-900/40 transition"
                        >
                    </div>
                </div>

                <!-- Nombre y Apellido -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label for="first_name" class="text-xs font-medium text-gray-400 uppercase
                        tracking-wider">
                            Nombre
                        </label>
                        <input
                            type="text"
                            name="first_name"
                            id="first_name"
                            value="{{ datos.first_name|default:'' }}"
                            required
                            placeholder="Ej. Diomedes"
                            class="w-full bg-gray-950/60 border border-gray-800 rounded-lg px-4
                            py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none
                            focus:border-green-600 focus:ring-2 focus:ring-green-900/40 transition"
                        >
                    </div>
                    <div class="space-y-1.5">
                        <label for="last_name" class="text-xs font-medium text-gray-400 uppercase
                        tracking-wider">
                            Apellido
                        </label>
                        <input
                            type="text"
                            name="last_name"
                            id="last_name"
                            value="{{ datos.last_name|default:'' }}"
                            required
                            placeholder="Ej. Díaz"
                            class="w-full bg-gray-950/60 border border-gray-800 rounded-lg px-4
                            py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none
                            focus:border-green-600 focus:ring-2 focus:ring-green-900/40 transition"
                        >
                    </div>
                </div>

                <!-- Correo electrónico -->
                <div class="space-y-1.5">
                    <label for="email" class="text-xs font-medium text-gray-400 uppercase
                    tracking-wider">
                        Correo electrónico
                    </label>
                    <div class="relative">
                        <svg class="w-4 h-4 text-gray-600 absolute left-3.5 top-1/2 -translate-y-1/2"
                        fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                        stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21.75 6.75v10.5a2.25 2.25 0 0 1-2.25 2.25h-15a2.25 2.25 0 0 1-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25m19.5 0v.243a2.25 2.25 0 0 1-1.07 1.916l-7.5 4.615a2.25 2.25 0 0 1-2.36 0L3.32 8.91a2.25 2.25 0 0 1-1.07-1.916V6.75" />
                        </svg>
                        <input
                            type="text"
                            name="email"
                            id="email"
                            value="{{ datos.email|default:'' }}"
                            required
                            placeholder="ejemplo@email.com"
                            class="w-full bg-gray-950/60 border border-gray-800 rounded-lg pl-10 pr-4
                            py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none
                            focus:border-green-600 focus:ring-2 focus:ring-green-900/40 transition"
                        >
                    </div>
                </div>

                <!-- Contraseña -->
                <div class="space-y-1.5">
                    <label for="password1" class="text-xs font-medium text-gray-400 uppercase
                    tracking-wider">
                        Contraseña
                    </label>
                    <div class="relative">
                        <svg class="w-4 h-4 text-gray-600 absolute left-3.5 top-1/2 -translate-y-1/2"
                        fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                        stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                        </svg>
                        <input
                            type="password"
                            name="password1"
                            id="password1"
                            required
                            placeholder="********"
                            class="w-full bg-gray-950/60 border border-gray-800 rounded-lg pl-10 pr-4
                            py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none
                            focus:border-green-600 focus:ring-2 focus:ring-green-900/40 transition"
                        >
                    </div>
                </div>

                <!-- Confirmar contraseña -->
                <div class="space-y-1.5">
                    <label for="password2" class="text-xs font-medium text-gray-400 uppercase
                    tracking-wider">
                        Confirmar contraseña
                    </label>
                    <div class="relative">
                        <svg class="w-4 h-4 text-gray-600 absolute left-3.5 top-1/2 -translate-y-1/2"
                        fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"
                        stroke-linecap="round" stroke-linejoin="round">
                            <path d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z" />
                        </svg>
                        <input
                            type="password"
                            name="password2"
                            id="password2"
                            required
                            placeholder="********"
                            class="w-full bg-gray-950/60 border border-gray-800 rounded-lg pl-10 pr-4
                            py-2.5 text-sm text-gray-200 placeholder-gray-600 focus:outline-none
                            focus:border-green-600 focus:ring-2 focus:ring-green-900/40 transition"
                        >
                    </div>
                </div>

                <!-- Botón de registro -->
                <button type="submit" class="w-full text-sm bg-green-600 hover:bg-green-500
                active:bg-green-700 text-white font-medium px-5 py-2.5 rounded-lg transition duration-150
                shadow-md shadow-green-900/20 text-center cursor-pointer">
                    Regístrame
                </button>
            </form>

            <!-- Pie: link a inicio de sesión -->
            <div class="px-6 md:px-8 py-4 bg-gray-950/30 border-t border-gray-800/80 text-sm
            text-gray-500 text-center">
                ¿Ya tienes cuenta?
                <a href="{% url 'login' %}" class="text-green-400 hover:text-green-300
                font-medium transition">
                    Inicia sesión
                </a>
            </div>

        </div>
    </main>

</body>
</html>
